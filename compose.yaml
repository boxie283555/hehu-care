services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: hehu
      POSTGRES_USER: hehu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hehu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hehu -d hehu"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  hehu_pgdata:
